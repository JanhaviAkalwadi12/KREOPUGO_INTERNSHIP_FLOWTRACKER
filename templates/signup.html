
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup | KreoPugo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='signup.css') }}">

    <script src="{{ url_for('static', filename='signup.js') }}" defer></script>
</head>

<body>

<div class="signup-container">

    <div class="header">
        <div class="logo">KREOPUGO</div>
        <p>Create your student account</p>
    </div>

    <div class="form-heading">Student Registration</div>
    <p class="form-description">
        Enter your details below to create your account.
    </p>

    <form id="signupForm"
          method="POST"
          action="{{ url_for('signup') }}"
          data-batches-url="{{ url_for('signup_batches') }}">

        <div class="form-grid">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter mobile number"
                       pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <div class="form-group">
                <label for="college">College Name</label>
                <input type="text" id="college" name="college"
                       placeholder="Enter your college name" required>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="B.Com">B.Com</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="BA">BA</option>
                    <option value="MCA">MCA</option>
                    <option value="MBA">MBA</option>
                    <option value="M.Com">M.Com</option>
                </select>
            </div>

            <div class="form-group">
                <label for="batch">Available Batch</label>
                <select id="batch" name="batch_id" required disabled>
                    <option value="">Select college and course first</option>
                </select>
                <small id="batchMessage"></small>
            </div>

            <div class="form-group">
                <label for="year_of_passout">Year of Passout</label>
                <select id="year_of_passout"
                        name="year_of_passout" required>
                    <option value="">Select Passout Year</option>
                    {% for year in passout_years %}
                    <option value="{{ year }}">{{ year }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="class_type">Class Type</label>
                <select id="class_type" name="class_type" required>
                    <option value="">Select Class Type</option>
                    <option value="Internship">Internship</option>
                    <option value="Project">Project</option>
                    <option value="Both">Both</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create password"
                       minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password"
                       name="confirm_password"
                       placeholder="Confirm password"
                       minlength="6" required>
                <small id="passwordMessage"></small>
            </div>

        </div>

        <button type="submit" id="signupButton" class="submit-btn">
            Create Account
        </button>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </form>
</div>

</body>
</html>
