<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | KreoPugo</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <main class="login-card">
        <div class="brand">KREOPUGO</div>
        <p class="subtitle">Flow Tracker · Account Recovery</p>

        <h2>Forgot Password?</h2>
        <p>Enter your registered email address to recover your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            <div class="messages">
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="email">Registered Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" class="btn">Reset Password</button>
        </form>

        <p style="text-align:center; margin-top:18px;">
            <a href="{{ url_for('login') }}"
               style="color:#781E12; text-decoration:none;">
                Back to Login
            </a>
        </p>
    </main>
</body>
</html>
