<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KreoPugo | Login Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
    <main class="login-card">
        <div class="brand">KREOPUGO</div>
        <p class="subtitle">Flow Tracker · Login Portal</p>

        <h2>Welcome Back</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            <div class="messages">
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="user_id">ID</label>
                <input
                    type="text"
                    id="user_id"
                    name="user_id"
                    placeholder="Enter your assigned ID"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <div style="text-align: right; margin-top: 8px;">
                    <a href="{{ url_for('forgot_password') }}"
                       style="color: #781E12; text-decoration: none;
                              font-size: 14px; font-weight: 600;">
                        Forgot Password?
                    </a>
                </div>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <a class="btn signup-btn" href="{{ url_for('signup') }}">
            Student Signup
        </a>

        <div class="footer">
            © 2026 KreoPugo Flow Tracker
        </div>
    </main>
</body>
</html>
